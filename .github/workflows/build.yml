# SPDX-FileCopyrightText: Copyright 2026 shadNet Project\r\n# SPDX-License-Identifier: GPL-2.0-or-later\r\n\r\n\r\nname: Build and Release\r\n\r\non:\r\n  push:\r\n    branches-ignore:\r\n      - "codex/chalice-*"\r\n      - "codex/root-chalice-*"\r\n    paths-ignore:\r\n      - "**/*.md"\r\n\r\n  pull_request:\r\n    paths-ignore:\r\n      - "**/*.md"\r\n\r\n  workflow_dispatch:\r\n\r\nconcurrency:\r\n  group: ci-${{ github.event_name }}-${{ github.ref }}\r\n  cancel-in-progress: ${{ github.event_name == 'push' }}\r\n\r\nenv:\r\n  BUILD_TYPE: Release\r\n\r\njobs:\r\n  reuse:\r\n    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/root-chalice-') }}\r\n    runs-on: ubuntu-24.04\r\n    continue-on-error: true\r\n    steps:\r\n    - uses: actions/checkout@v4\r\n    - uses: fsfe/reuse-action@v5\r\n\r\n  clang-format:\r\n    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/root-chalice-') }}\r\n    runs-on: ubuntu-24.04\r\n    continue-on-error: true\r\n    steps:\r\n    - uses: actions/checkout@v4\r\n      with:\r\n        fetch-depth: 0\r\n\r\n    - name: Install clang-format-19\r\n      run: |\r\n        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -\r\n        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'\r\n        sudo apt-get update\r\n        sudo apt-get install -y clang-format-19\r\n\r\n    - name: Check formatting\r\n      run: |\r\n        find src clientsample -name '*.cpp' -o -name '*.h' \\r\n          | xargs clang-format-19 --dry-run --Werror\r\n\r\n  get-qt-version:\r\n    runs-on: ubuntu-24.04\r\n    outputs:\r\n      version: ${{ steps.resolve.outputs.version }}\r\n    steps:\r\n    - name: Resolve latest installable Qt6\r\n      id: resolve\r\n      run: |\r\n        pip install aqtinstall --quiet\r\n\r\n        # All known Qt6 versions, newest first\r\n        VERSIONS=$(python -m aqt list-qt windows desktop \\r\n                   | tr ' ' '\n' \\r\n                   | grep '^6\.' \\r\n                   | sort -rV)\r\n\r\n        SELECTED=""\r\n        for VER in $VERSIONS; do\r\n          echo "Checking Qt $VER..."\r\n          # --arch queries the per-version Updates.xml; non-zero exit = not ready yet\r\n          if python -m aqt list-qt windows desktop --arch "$VER" 2>/dev/null \\r\n             | grep -q 'win64_msvc2022_64'; then\r\n            SELECTED="$VER"\r\n            break\r\n          fi\r\n          echo "  Qt $VER not yet available on mirrors, trying older version."\r\n        done\r\n\r\n        if [ -z "$SELECTED" ]; then\r\n          echo "ERROR: no installable Qt6 version found."\r\n          exit 1\r\n        fi\r\n\r\n        echo "Selected Qt6: $SELECTED"\r\n        echo "version=$SELECTED" >> $GITHUB_OUTPUT\r\n\r\n  get-info:\r\n    runs-on: ubuntu-24.04\r\n    outputs:\r\n      date:      ${{ steps.vars.outputs.date }}\r\n      shorthash: ${{ steps.vars.outputs.shorthash }}\r\n      fullhash:  ${{ steps.vars.outputs.fullhash }}\r\n    steps:\r\n    - uses: actions/checkout@v4\r\n    - name: Get date and git hash\r\n      id: vars\r\n      run: |\r\n        echo "date=$(date +'%Y-%m-%d')"                >> $GITHUB_OUTPUT\r\n        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT\r\n        echo "fullhash=$(git rev-parse HEAD)"           >> $GITHUB_OUTPUT\r\n\r\n  windows:\r\n    runs-on: windows-2025\r\n    needs: [get-info, get-qt-version]\r\n    steps:\r\n    - uses: actions/checkout@v4\r\n      with:\r\n        submodules: recursive\r\n\r\n    - name: Install Qt6 ${{ needs.get-qt-version.outputs.version }}\r\n      uses: jurplel/install-qt-action@v4\r\n      with:\r\n        version: ${{ needs.get-qt-version.outputs.version }}\r\n        host: 'windows'\r\n        target: 'desktop'\r\n        arch: 'win64_msvc2022_64'\r\n        modules: 'qthttpserver qtwebsockets'\r\n        cache: true\r\n\r\n    - name: Setup Visual Studio shell\r\n      uses: egor-tensin/vs-shell@v2\r\n      with:\r\n        arch: x64\r\n\r\n    - name: Check formatting (Windows-only branch validation)\r\n      shell: pwsh\r\n      run: |\r\n        $files = @(\r\n          "src/bloodborne_summon_broker.cpp",\r\n          "src/bloodborne_summon_broker.h",\r\n          "src/config.cpp",\r\n          "src/config.h",\r\n          "src/webapi_routes_bloodborne.cpp",\r\n          "src/webapi_routes_bloodborne.h",\r\n          "src/webapi_server.cpp",\r\n          "tests/test_bloodborne_bootstrap.cpp",\r\n          "tests/test_bloodborne_summon_broker.cpp",\r\n          "tests/test_config.cpp"\r\n        )\r\n        clang-format --dry-run --Werror $files\r\n\r\n    - name: Cache CMake configuration\r\n      uses: actions/cache@v4\r\n      env:\r\n        cache-name: ${{ runner.os }}-cmake-config\r\n      with:\r\n        path: ${{ github.workspace }}/build\r\n        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}\r\n        restore-keys: ${{ env.cache-name }}-\r\n\r\n    - name: Cache CMake build\r\n      uses: hendrikmuhs/ccache-action@v1.2.21\r\n      env:\r\n        cache-name: ${{ runner.os }}-cmake-build\r\n      with:\r\n        append-timestamp: false\r\n        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}\r\n\r\n    - name: Configure CMake\r\n      run: >\r\n        cmake --fresh -G Ninja\r\n        -B ${{ github.workspace }}/build\r\n        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}\r\n        -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON\r\n        -DCMAKE_C_COMPILER=clang-cl\r\n        -DCMAKE_CXX_COMPILER=clang-cl\r\n        -DCMAKE_C_COMPILER_LAUNCHER=ccache\r\n        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache\r\n\r\n    - name: Build\r\n      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel $env:NUMBER_OF_PROCESSORS\r\n\r\n    - name: Build and run tests\r\n      run: |\r\n        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target test_config test_bloodborne_summon_broker test_bloodborne_bootstrap test_bloodborne_online_service test_bloodborne_chalice_service test_bloodborne_reference_proxy test_server_logger test_bloodborne_website --parallel $env:NUMBER_OF_PROCESSORS\r\n        ctest --test-dir ${{ github.workspace }}/build -C ${{ env.BUILD_TYPE }} --output-on-failure\r\n\r\n    - name: Stage release\r\n      shell: pwsh\r\n      run: |\r\n        New-Item -ItemType Directory -Force staging\r\n        Copy-Item ${{ github.workspace }}/build/shadnet.exe staging/\r\n        Copy-Item ${{ github.workspace }}/build/worlds.cfg staging/\r\n        Copy-Item ${{ github.workspace }}/build/scoreboards.cfg staging/\r\n        Copy-Item ${{ github.workspace }}/build/shadnet.example.cfg staging/\r\n        Copy-Item -Recurse ${{ github.workspace }}/build/web staging/web\r\n        # Copies Qt6 DLLs, sqldrivers/qsqlite.dll, and VC runtime alongside the exe\r\n        windeployqt6 --release --no-translations staging/shadnet.exe\r\n\r\n    - name: Upload Windows artifact\r\n      uses: actions/upload-artifact@v4\r\n      with:\r\n        name: shadnet-win64-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}\r\n        path: staging/\r\n\r\n  linux:\r\n    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/chalice-') && !startsWith(github.head_ref || github.ref_name, 'codex/root-chalice-') }}\r\n    runs-on: ubuntu-24.04\r\n    needs: [get-info, get-qt-version]\r\n    steps:\r\n    - uses: actions/checkout@v4\r\n      with:\r\n        submodules: recursive\r\n\r\n    - name: Add LLVM repository\r\n      run: |\r\n        wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -\r\n        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'\r\n\r\n    - name: Install dependencies\r\n      run: |\r\n        sudo apt-get update\r\n        sudo apt-get install -y \\r\n          ninja-build mold \\r\n          clang-19 \\r\n          qt6-base-dev libqt6sql6-sqlite\r\n\r\n    - name: Install Qt6 ${{ needs.get-qt-version.outputs.version }}\r\n      uses: jurplel/install-qt-action@v4\r\n      with:\r\n        version: ${{ needs.get-qt-version.outputs.version }}\r\n        host: 'linux'\r\n        target: 'desktop'\r\n        modules: 'qthttpserver qtwebsockets'\r\n        cache: true\r\n\r\n    - name: Cache CMake configuration\r\n      uses: actions/cache@v4\r\n      env:\r\n        cache-name: ${{ runner.os }}-cmake-config\r\n      with:\r\n        path: ${{ github.workspace }}/build\r\n        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}\r\n        restore-keys: ${{ env.cache-name }}-\r\n\r\n    - name: Cache CMake build\r\n      uses: hendrikmuhs/ccache-action@v1.2.21\r\n      env:\r\n        cache-name: ${{ runner.os }}-cmake-build\r\n      with:\r\n        append-timestamp: false\r\n        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}\r\n\r\n    - name: Configure CMake\r\n      run: >\r\n        cmake --fresh -G Ninja\r\n        -B ${{ github.workspace }}/build\r\n        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}\r\n        -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON\r\n        -DCMAKE_C_COMPILER=clang-19\r\n        -DCMAKE_CXX_COMPILER=clang++-19\r\n        -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold"\r\n        -DCMAKE_C_COMPILER_LAUNCHER=ccache\r\n        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache\r\n\r\n    - name: Build\r\n      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel $(nproc)\r\n\r\n    - name: Build and run tests\r\n      run: |\r\n        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target test_bloodborne_summon_broker test_bloodborne_bootstrap test_bloodborne_online_service test_bloodborne_chalice_service test_bloodborne_reference_proxy test_server_logger test_bloodborne_website --parallel $(nproc)\r\n        ctest --test-dir ${{ github.workspace }}/build --output-on-failure\r\n\r\n    - name: Package\r\n      run: |\r\n        mkdir -p staging\r\n        cp build/shadnet build/worlds.cfg build/scoreboards.cfg staging/\r\n        cp -a build/web staging/web\r\n        tar czf shadnet-linux64.tar.gz -C staging .\r\n\r\n    - name: Upload Linux artifact\r\n      uses: actions/upload-artifact@v4\r\n      with:\r\n        name: shadnet-linux64-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}\r\n        path: shadnet-linux64.tar.gz\r\n\r\n  pre-release:\r\n    if: github.ref == 'refs/heads/main' && github.event_name == 'push'\r\n    needs: [get-info, windows, linux]\r\n    runs-on: ubuntu-latest\r\n    permissions:\r\n      contents: write   # required to create releases and upload assets\r\n    steps:\r\n    - name: Download all artifacts\r\n      uses: actions/download-artifact@v4\r\n      with:\r\n        path: ./artifacts\r\n\r\n    - name: Compress artifacts\r\n      run: |\r\n        cd ./artifacts\r\n        for dir in */; do\r\n          dir_name=${dir%/}\r\n          echo "Zipping $dir_name"\r\n          (cd "$dir_name" && zip -r "../${dir_name}.zip" .)\r\n        done\r\n\r\n    - name: Get latest release tag\r\n      env:\r\n        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\r\n      run: |\r\n        latest=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \\r\n          "https://api.github.com/repos/${{ github.repository }}/releases/latest" \\r\n          | jq -r '.tag_name // "none"')\r\n        echo "last_release_tag=$latest" >> $GITHUB_ENV\r\n\r\n    - name: Create Pre-Release\r\n      uses: ncipollo/release-action@v1\r\n      with:\r\n        token: ${{ secrets.GITHUB_TOKEN }}\r\n        name: "shadnet-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"\r\n        tag: "pre-release-shadnet-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}"\r\n        draft: false\r\n        prerelease: true\r\n        body: |\r\n          Full Changelog: [${{ env.last_release_tag }}...${{ needs.get-info.outputs.shorthash }}](https://github.com/${{ github.repository }}/compare/${{ env.last_release_tag }}...${{ needs.get-info.outputs.fullhash }})\r\n        artifacts: ./artifacts/*.zip\r\n\r\n    - name: Delete old pre-releases and tags\r\n      env:\r\n        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\r\n      run: |\r\n        api_url="https://api.github.com/repos/${{ github.repository }}/releases"\r\n        current_tag="pre-release-shadnet-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.fullhash }}"\r\n        releases=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$api_url")\r\n\r\n        echo "$releases" | jq -c '.[] | select(.prerelease == true)' | while read -r release; do\r\n          release_id=$(echo "$release"  | jq -r '.id')\r\n          release_tag=$(echo "$release" | jq -r '.tag_name')\r\n\r\n          if [[ "$release_tag" != "$current_tag" ]]; then\r\n            echo "Deleting old pre-release: $release_tag"\r\n            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$api_url/$release_id"\r\n            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \\r\n              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$release_tag"\r\n          fi\r\n        done\r\n