name: One-time chat formatting

on:
  push:
    branches:
      - bloodborne-bootstrap
    paths:
      - ".github/workflows/format-chat-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bloodborne-bootstrap
      - name: Install clang-format-19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19
      - name: Format chat C++ and remove one-time workflow
        run: |
          clang-format-19 -i src/bloodborne_website.cpp src/config.cpp src/config.h src/database.cpp
          rm .github/workflows/format-chat-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bloodborne_website.cpp src/config.cpp src/config.h src/database.cpp .github/workflows/format-chat-once.yml
          git commit -m "Apply clang-format to Hunter's Communion"
          git push origin HEAD:bloodborne-bootstrap
