; shadNet grouped configuration example.
; Existing flat [General] files remain supported. A grouped key wins when both exist.

[Server]
Host=0.0.0.0
UnsecuredPort=31313

[Network]
Matching2Enabled=true
MatchingUdpPort=31314
WebApiPort=31315

[Bloodborne]
BootstrapEnabled=true
PublicBaseUrl=http://127.0.0.1:31315
ReferenceProxyEnabled=false
ReferenceProxyUrl=http://thehuntersdream.com:18671
SeamlessCoop=false
GhostLifetimeSeconds=600

[BloodborneSummon]
; Vanilla preserves all original location and distance restrictions.
; SameRegion is recommended for easier co-op without changing spawn behavior.
; SameArea is experimental and also ignores AreaRegionId.
LocationMode=Vanilla

[Website]
Enabled=true
Port=31316
RegistrationEnabled=true
ExternalAssetsEnabled=true
ExternalAssetsPath=web
ChatEnabled=true
ChatMaxMessageLength=400
ChatHistoryLimit=100
ChatResetHours=24
WelcomeNoticeEnabled=true
WelcomeNoticeTitle=The Hunter's Requiem
WelcomeNoticeBody=Welcome to the private Bloodborne server.
WelcomeMessageEnabled=false
WelcomeMessage=

[Downloads]
MaxFileSizeMiB=512

[Accounts]
EmailValidated=false
AdminsList=
RegistrationSecretKey=

[Stats]
Enabled=false
Port=31320
Path=stats
CacheLife=30

[Debug]
ServerLogEnabled=true
ServerLogDirectory=logs
ServerLogKeepDays=30
ServerLogFlushImmediately=true
BloodborneSummonTrace=false
BloodborneFeedTrace=false
